name: tests

# Unit tests only. The database and the raw files are not in the repository (third-party data), so tests that need them
# are skipped on a fresh clone; the rest (rules, stints, possessions on synthetic and fixture games, marts on tiny
# hand-made tables, validation code) run on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q
